[package]
name = "id2scribe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "IETF Internet-Draft to Kindle Scribe PDF Converter with wide stylus margins"
readme = "README.md"
keywords = ["ietf", "kindle", "scribe", "pdf", "rfc"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
headless_chrome = "1.0.22"
reqwest = { version = "0.13.5", features = ["json"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.17"
tokio = { version = "1.53.2", features = ["full"] }
which = "8.0"
